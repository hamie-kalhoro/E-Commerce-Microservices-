server:
  port: 8040
spring:
  data:
    mongodb:
      username: Hamid
      password: Hamid
      host: localhost
      port: 27017
      database: notification
      authentication-database: admin
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentGroup,orderGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: orderConfirmation:com.hamidi.ecommerce.kafka.OrderConfirmation,paymentConfirmation:com.hamidi.ecommerce.notification.PaymentNotificationRequest
  mail:
    host: localhost
    port: 1025
    username: Hamid
    password: Hamid
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enable: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000